version: '3'
services:
  api:
    build: .
    depends_on:
      - postgres
    port:
      - 8000:8000
    volumes:
      - ./:/usr/src/app:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    # env_file:
    #   - ./.env
    environment:
      - DB_HOST={DB_HOST}
      - DB_PORT={DB_PORT}
      - DB_PASSWORD={DB_PASSWORD}
      - DB_NAME={DB_NAME}
      - DB_USERNAME={DB_USERNAME}
      - SECRET_KEY={SECRET_KEY}
      - ALGORITHM={ALGORITHM}
      - ACCESS_TOKEN_EXPIRY={ACCESS_TOKEN_EXPIRY}
  postgres:
    image:
    environment:
      - POSTGRES_PASSWORD={DB_PASSWORD}
      - POSTGRES_DB={DB_NAME}
    volumes:
      -postgres-db:/var/lib/postgresql/data
volumes:
  postgres-db: